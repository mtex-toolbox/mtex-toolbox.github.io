repository: mtex-toolbox/mtex

output: web
# this property is useful for conditional filtering of content that is separate from the PDF.

topnav_title: MTEX Toolbox
# this appears on the top navigation bar next to the home button

site_title: MTEX
# this appears in the html browser tab for the site title (seen mostly by search engines, not users)

company_name:
# this appears in the footer

github_editme_path: 
# if you're using Github, provide the basepath to the branch you've created for reviews, following the sample here. if not, leave this value blank.

# gitlab_editme_path: tomjoht/documentation-theme-jekyll/blob/gh-pages/
# if you're using GitLab, provide the basepath to the branch you've created for reviews, following the sample here. if not, leave this value blank.

disqus_shortname:
# if you're using disqus for comments, add the shortname here. if not, leave this value blank.

google_analytics: UA-83346204-1
# if you have google-analytics ID, put it in. if not, edit this value to blank.

host: 127.0.0.1
# the preview server used. Leave as is.

port: 4000
# the port where the preview is rendered. You can leave this as is unless you have other Jekyll builds using this same port that might cause conflicts. in that case, use another port such as 4006.

exclude:
  - .idea/
  - .gitignore
  -  matlab/
  - CLAUDE.md
# these are the files and directories that jekyll will exclude from the build
# CLAUDE.md is repo guidance, not site content. It has no front matter, so the
# github-pages jekyll-optional-front-matter plugin would render it as a page and
# choke on the `{% highlight matlab %}` it quotes in prose (backticks do not
# protect Liquid tags) -- that broke the build on 2026-08-07.

feedback_subject_line: MTEX

feedback_email: tomjoht@gmail.com
# used as a contact email for the Feedback link in the top navigation bar

feedback_disable: true
# if you uncomment the previous line, the Feedback link gets removed

# feedback_text: "Need help?"
# if you uncomment the previous line, it changes the Feedback text

# feedback_link: "http://helpy.io/"
# if you uncomment the previous line, it changes where the feedback link points to

highlighter: rouge
# library used for syntax highlighting

plugins: 
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

# filter used to process markdown. note that kramdown differs from github-flavored markdown in some subtle ways

collections:
  tooltips:
    output: false
# collections are declared here. this renders the content in _tooltips and processes it, but doesn't output it as actual files in the output unless you change output to true

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      comments: true
      search: true
      sidebar: home_sidebar
      topnav: topnav
  -
    scope:
      path: ""
      type: "tooltips"
    values:
      layout: "page"
      comments: true
      search: true
      tooltip: true

  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      search: true
      sidebar: home_sidebar
      topnav: topnav

# these are defaults used for the frontmatter for these file types

sidebars:
- documentation_sidebar
- function_reference_sidebar

description: MTEX is a free MATLAB toolbox for analyzing and modeling crystallographic textures by means of EBSD or pole figure data.
# the description is used in the feed.xml file and as the fallback description in
# the JSON-LD emitted by _includes/custom/jsonld.html

url: https://mtex-toolbox.github.io
# The absolute site root. sitemap.xml, robots.txt, llms.txt, the RSS <link> in
# head.html and the canonical/JSON-LD tags all interpolate site.url; while this
# was commented out they emitted URLs with an empty host. There is no baseurl:
# the site is served from the root of mtex-toolbox.github.io and every page
# carries its own flat permalink.

# --- attribution metadata -------------------------------------------------
# Single source of truth for "who made this and how do I cite it". Consumed by
# _includes/custom/jsonld.html (machine-readable), _includes/custom/citation.html
# (the visible footer on every generated page), llms.txt and robots.txt.
mtex_repo: https://github.com/mtex-toolbox/mtex
mtex_license_name: GNU General Public License v2.0
mtex_license_url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
doc_license_name: CC BY 4.0
doc_license_url: https://creativecommons.org/licenses/by/4.0/
doc_author: The MTEX Developers

# The one paper a machine should reach for when it has to pick a single
# reference. Humans get the full, application-specific list on /publications.
citation:
  authors: F. Bachmann, R. Hielscher, H. Schaeben
  title: Texture Analysis with MTEX - Free and Open Source Software Toolbox
  journal: Solid State Phenomena
  volume: 160
  pages: 63-68
  year: 2010
  doi: 10.4028/www.scientific.net/SSP.160.63
  url: https://doi.org/10.4028/www.scientific.net/SSP.160.63
  bibkey: bachmann2010mtex

# compress settings
compress_html:
  clippings: []
  comments: []
  endings: []
  ignore:
    envs: []
  blanklines: true
  profile: false
  startings: []
