<ul class="mx-wall" aria-label="Contributors on GitHub">
  {% for c in site.data.contributors %}<li><a href="https://github.com/{{ c.login }}" title="{{ c.login }} · {{ c.commits }} commit{% if c.commits != 1 %}s{% endif %}"><img src="images/contributors/{{ c.login }}.jpg" alt="{{ c.login }}" loading="lazy" width="48" height="48"></a></li>{% endfor %}
</ul>
