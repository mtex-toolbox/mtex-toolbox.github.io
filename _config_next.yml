# Overrides for the preview site, used only by tools/deploy-next.sh:
#
#     bundle exec jekyll build --config _config.yml,_config_next.yml
#
# GitHub Pages builds the live site from _config.yml alone, so nothing here
# reaches mtex-toolbox.github.io.

url: https://mtex-playground.github.io

# Marks every page noindex (_includes/head.html) and closes robots.txt, so
# search engines do not list the preview next to the live site.
preview: true

# Jekyll replaces a list instead of merging it, so this repeats the exclude list
# of _config.yml. The figures are published from their own repository at
# /figures/, and the tools and the deploy output are not site content.
exclude:
  - .idea/
  - .gitignore
  - matlab/
  - CLAUDE.md
  - README.md
  - figures/
  - tools/
  - update.sh
  - _config_next.yml
  - GO-LIVE.md
  - pages/workshops/notes.md
