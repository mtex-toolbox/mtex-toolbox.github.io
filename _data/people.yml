# The people of the people page (pages/people/people.html), in this order.
# photo is in images/profiles/.

- name: Ralf Hielscher
  photo: ralf-hielscher.png
  role: Founder and lead developer
  text: Invented MTEX in 2007 by implementing the algorithm that turns pole figures into an ODF, and has led its development since then.
  place: Institute of Applied Analysis, TU Bergakademie Freiberg
  url: https://tu-freiberg.de/fakult1/ana/hielscher
  email: Ralf.Hielscher@math.tu-freiberg.de

- name: Rüdiger Kilian
  photo: ruediger-kilian.png
  role: EBSD and grains
  text: Joined MTEX in 2008 as a PhD student of Renée Heilbronner in Basel. He has answered hundreds of questions in the forum and keeps improving the EBSD and grain analysis of MTEX.
  place: Martin-Luther-Universität Halle-Wittenberg
  url: https://geodynamics.geo.uni-halle.de/ruediger-kilian

- name: David Mainprice
  photo: david-mainprice.png
  role: Tensors and seismic properties
  text: Joined MTEX in 2009 by sharing his code for tensor properties and seismic velocities, and has brought MTEX to the geoscience community ever since.
  place: Géosciences Montpellier, France
  url: http://www.gm.univ-montp2.fr/PERSO/mainprice/

- name: Luiz Fernando Grafulha Morales
  photo: Luiz-Morales.webp
  role: Physical properties, support and workshops
  text: A structural geologist, electron microscopist and long-time MTEX user. He helps with physical properties, user support and the workshops.
  place: ScopeM, ETH Zürich, Switzerland
  url: https://structuretectonics.org/people/luiz-morales/

- name: Florian Bachmann
  photo: florian-bachmann.png
  role: Grain reconstruction
  text: Started with MTEX in his diploma thesis at TU Freiberg in 2008, where he implemented the grain reconstruction. He also built the import wizard and the documentation centre.
  place: Xnovo Technology ApS, Denmark
  url: https://xnovotech.com/

- name: Bjørn Eske Sørensen
  photo: bjorn-eske-soerensen.png
  role: Spectral diffraction and birefringence
  text: Contributes to spectral diffraction and birefringence.
  place: Department of Geoscience and Petroleum, NTNU, Norway
  url: https://www.ntnu.edu/employees/bjorn.sorensen

- name: Tuomo Nyyssönen
  photo: tuomo-nyyssoenen.png
  role: Parent grain reconstruction
  text: Worked on parent austenite reconstruction during his PhD at Tampere University of Technology, and wrote the first MTEX code for reconstructing parent grains and determining the orientation relationship.
  url: https://www.researchgate.net/profile/Tuomo-Nyyssoenen

- name: Frank Niessen
  photo: frank-niessen.png
  role: Orientation relationships
  text: Generalised the orientation relationship analysis and parent grain reconstruction to arbitrary phase combinations, and wrote the export to ctf and ang files.
  place: Department of Mechanical Engineering, Technical University of Denmark
  url: https://www.researchgate.net/profile/Frank_Niessen4

- name: Vivian Tong
  photo: vivian-tong.jpg
  role: TrueEBSD
  text: Uses MTEX to study plastic deformation in engineering materials. She developed TrueEBSD, the image registration for correlative microscopy, and contributed many features and fixes.
  place: National Physical Laboratory, UK
  url: https://scholar.google.co.uk/citations?user=GvwErjEAAAAJ

- name: Azdiar Gazder
  photo: azdiar.jpg
  role: Orientation relationships
  text: Worked on the orientation relationship analysis and parent grain reconstruction for arbitrary phase combinations. Co-developer of the ORTools and phaseSegmenter toolboxes and author of mtexTools.
  place: Electron Microscopy Centre, University of Wollongong
  url: https://scholars.uow.edu.au/azdiar-gazder

- name: Felix Bartel
  photo: felix-bartel.png
  role: Spherical functions
  text: Wrote the classes of spherical functions during his master's thesis at TU Chemnitz in 2019.
  place: Institute of Mathematics, TU Chemnitz
  url: https://www.tu-chemnitz.de/~febar

- name: Erik Wünsche
  photo: erik-wuensche.png
  role: Functions on the rotation group
  text: Wrote the classes of functions on the rotation group during his PhD at TU Freiberg.
  place: TU Bergakademie Freiberg
  url: https://tu-freiberg.de/fakult1/ana/hielscher

- name: Oliver Kent Johnson
  photo: oliver-kent-johnson.png
  role: Misorientation colour key
  text: Implemented the misorientation colour key. He finished his PhD in 2015 with Christopher A. Schuh at MIT.

- name: Fabian Bartl
  photo: fabian-bartl.png
  role: Website
  text: Has looked after the website since 2021.
  place: TU Bergakademie Freiberg
  url: https://tu-freiberg.de/
