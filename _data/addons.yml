# The toolboxes of the add-ons page (pages/addons/addons.html). image is in
# images/thumbnails/.

- name: TrueEBSD
  image: TrueEBSD_webpage_pic.gif
  text: Corrects spatial distortions and aligns images with electron backscatter diffraction maps.
  authors:
  - name: Vivian Tong
    url: https://github.com/vtvivian
  url: https://github.com/vtvivian/mtex-trueEbsd
  where: GitHub
- name: ORTools
  image: ORTools_logo.png
  text: Orientation relationship discovery and analysis, with publication-ready figures of microstructures after a partial or full phase transformation. An add-on to the phase transition functions of MTEX.
  authors:
  - name: Azdiar A. Gazder
    url: https://www.researchgate.net/profile/Azdiar_Gazder
  - name: Frank Niessen
    url: https://www.researchgate.net/profile/Frank_Niessen4
  url: https://www.github.com/frankNiessen/ORTools
  where: GitHub
- name: SSLIP
  image: SSLIP.gif
  text: Slip System based Identification of Local Plasticity. Identifies slip system activity point by point, by matching digital image correlation displacement gradients to the slip systems derived from EBSD data.
  authors:
  - name: Tijmen Vermeij
    url: https://github.com/Tijmenvermeij
  url: https://github.com/Tijmenvermeij/SSLIP
  where: GitHub
- name: Stabix
  image: stabix_screenshot.gif
  text: Slip transfer analysis at grain boundaries.
  authors:
  - name: David Mercier
    url: https://www.researchgate.net/profile/David_Mercier3
  url: https://stabix.readthedocs.io/en/latest/index.html
  where: Read the Docs
- name: MTEX2Gmsh
  image: MTEX2Gmsh_logo.png
  text: Generates meshes from EBSD data for finite element analysis at the grain scale.
  authors:
  - name: Dorian Depriester
    url: https://www.researchgate.net/profile/Dorian_Depriester
  url: https://github.com/DorianDepriester/MTEX2Gmsh
  where: GitHub
- name: phaseSegmenter
  image: phaseSegmenter_screenshot.png
  text: Separates crystallographically identical or similar phases by their composition, using reindexed EBSD data and EDS element maps.
  authors:
  - name: Azdiar A. Gazder
    url: https://www.researchgate.net/profile/Azdiar_Gazder
  - name: Frank Niessen
    url: https://www.researchgate.net/profile/Frank_Niessen4
  url: https://www.github.com/frankNiessen/phaseSegmenter
  where: GitHub
- name: CVA
  image: CVA.png
  text: Orientation dispersion analysis by principal geodesic analysis, including the crystallographic vorticity axis analysis of Michels et al. (2015), which tracks the vorticity axes of shear zones.
  authors:
  - name: Zachary Michels
    url: https://www.researchgate.net/profile/Zachary-Michels
  url: https://github.com/zmichels/CVA
  where: GitHub
- name: crystalAligner
  image: crystalAligner_logo.png
  text: Computes the stage tilt and rotation that align one or two crystal directions or plane normals with the coordinate system of a scanning electron microscope.
  authors:
  - name: Frank Niessen
    url: https://www.researchgate.net/profile/Frank_Niessen4
  url: https://www.github.com/frankNiessen/crystalAligner
  where: GitHub
