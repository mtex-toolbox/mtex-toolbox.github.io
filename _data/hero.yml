- name: Twins
  code: "<span class=\"c\">% magnesium {10-12} extension twin</span>\ntwin = <span class=\"k\">orientation.byAxisAngle</span>(...\n  <span class=\"k\">Miller</span>(1,0,-1,2,grains.CS),180*degree);\ngB = grains.<span class=\"k\">boundary</span>(<span class=\"s\">'Magnesium'</span>,<span class=\"s\">'Magnesium'</span>);\ntwinB = gB(gB.<span class=\"k\">isTwinning</span>(twin,5*degree));\n<span class=\"k\">plot</span>(twinB,<span class=\"s\">'lineColor'</span>,<span class=\"s\">'w'</span>,<span class=\"s\">'lineWidth'</span>,3)\n\n<span class=\"c\">% merge grains across twin boundaries</span>\nparents = <span class=\"k\">merge</span>(grains,twinB);\n<span class=\"k\">plot</span>(parents.boundary,<span class=\"s\">'lineWidth'</span>,3)"
  python: "<span class=\"c\"># magnesium {10-12} extension twin</span>\ntwin = <span class=\"k\">orientation.byAxisAngle</span>(\n  <span class=\"k\">Miller</span>(1,0,-1,2,grains.CS),180*degree)\ngB = grains.boundary[<span class=\"s\">'Magnesium'</span>,<span class=\"s\">'Magnesium'</span>]\ntwinB = gB[<span class=\"k\">gB.isTwinning</span>(twin,5*degree)]\n<span class=\"k\">plot</span>(twinB,lineColor=<span class=\"s\">'w'</span>,lineWidth=3)\n\n<span class=\"c\"># merge grains across twin boundaries</span>\nparents = <span class=\"k\">merge</span>(grains,twinB)\n<span class=\"k\">plot</span>(parents.boundary,lineWidth=3)"
