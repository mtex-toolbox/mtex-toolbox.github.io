- name: Parent grains
  code: '<span class="c">% reconstruct beta grains from alpha titanium</span>

    mtexdata alphaBetaTitanium

    job = <span class="k">parentGrainReconstructor</span>(ebsd);

    job.p2c = <span class="k">orientation.Burgers</span>(job.csParent,job.csChild);


    <span class="c">% group variants and assign parent orientations</span>

    job.<span class="k">calcVariantGraph</span>(<span class="s">''threshold''</span>,1.5*degree);

    job.<span class="k">clusterVariantGraph</span>(<span class="s">''numIter''</span>,3);

    job.calcParentFromVote;

    <span class="k">plot</span>(job.parentGrains,<span class="s">''ipfDirection''</span>,zvector)'
  python: '<span class="c"># reconstruct beta grains from alpha titanium</span>

    ebsd = <span class="k">mtexdata</span>(<span class="s">''alphaBetaTitanium''</span>)

    job = <span class="k">parentGrainReconstructor</span>(ebsd)

    job.p2c = <span class="k">orientation.Burgers</span>(job.csParent,job.csChild)


    <span class="c"># group variants and assign parent orientations</span>

    <span class="k">job.calcVariantGraph</span>(threshold=1.5*degree)

    <span class="k">job.clusterVariantGraph</span>(numIter=3)

    <span class="k">job.calcParentFromVote</span>()

    <span class="k">plot</span>(job.parentGrains,ipfDirection=zvector)'
  figures:
  - file: figures/hero/parent_1.png
    caption: Measured alpha
  - file: figures/hero/parent_2.png
    caption: Reconstructed beta
- name: Properties
  code: "<span class=\"c\">% single-crystal stiffness of magnesium (GPa)</span>\nCij = [59.7 26.2 21.7 0 0 0;  26.2 59.7 21.7 0 0 0;\n       21.7 21.7 61.7 0 0 0;  0 0 0 16.4 0 0;\n       0 0 0 0 16.4 0;  0 0 0 0 0 16.75];\nC = <span class=\"k\">stiffnessTensor</span>(Cij,ebsd(<span class=\"s\">'Magnesium'</span>).CS);\n\n<span class=\"c\">% average over the measured texture (Hill)</span>\n[~,~,CHill] = <span class=\"k\">calcTensor</span>(ebsd(<span class=\"s\">'Magnesium'</span>),C);\n<span class=\"k\">plot</span>(C.YoungsModulus,<span class=\"s\">'complete'</span>,<span class=\"s\">'upper'</span>)\n<span class=\"k\">plot</span>(CHill.YoungsModulus,<span class=\"s\">'complete'</span>,<span class=\"s\">'upper'</span>)"
  python: "<span class=\"c\"># single-crystal stiffness of magnesium (GPa)</span>\nCij = [[59.7,26.2,21.7,0,0,0], [26.2,59.7,21.7,0,0,0],\n       [21.7,21.7,61.7,0,0,0], [0,0,0,16.4,0,0],\n       [0,0,0,0,16.4,0], [0,0,0,0,0,16.75]]\nC = <span class=\"k\">stiffnessTensor</span>(Cij,ebsd[<span class=\"s\">'Magnesium'</span>].CS)\n\n<span class=\"c\"># average over the measured texture (Hill)</span>\nCHill = <span class=\"k\">calcTensor</span>(ebsd[<span class=\"s\">'Magnesium'</span>],C,<span class=\"s\">'Hill'</span>)\n<span class=\"k\">plot</span>(<span class=\"k\">C.YoungsModulus</span>(),complete=True,upper=True)\n<span class=\"k\">plot</span>(<span class=\"k\">CHill.YoungsModulus</span>(),complete=True,upper=True)"
  figures:
  - file: figures/hero/properties_1.png
    caption: Single crystal
  - file: figures/hero/properties_2.png
    caption: Textured polycrystal
- name: 3D EBSD
  code: '<span class="c">% a 3D EBSD volume and its grains</span>

    fname = <span class="k">fullfile</span>(mtexEBSDPath,<span class="s">''SmallIN100_MeshStats.dream3d''</span>);

    ebsd = <span class="k">EBSD3.load</span>(fname);

    [grains,ebsd] = <span class="k">calcGrains</span>(ebsd,<span class="s">''angle''</span>,5*degree);

    <span class="k">plot</span>(grains,grains.meanOrientation,<span class="s">''edgeAlpha''</span>,0.1)


    [~,id] = <span class="k">max</span>(grains.volume);

    grains = <span class="k">reduceBoundary</span>(grains,2,<span class="s">''quadric''</span>);

    grains = <span class="k">smoothBoundary</span>(grains,<span class="k">taubinFilter</span>(20));

    <span class="k">plot</span>(grains(id),grains(id).meanOrientation,<span class="s">''edgeAlpha''</span>,0)

    camlight; lighting gouraud'
  python: '<span class="c"># a 3D EBSD volume and its grains</span>

    ebsd = <span class="k">EBSD3.load</span>(<span class="k">mtexdatafile</span>(<span class="s">''SmallIN100''</span>))

    grains = <span class="k">calcGrains</span>(ebsd,angle=5*degree)

    <span class="k">plot</span>(grains,grains.meanOrientation,edgeAlpha=0.1)


    id = <span class="k">grains.volume.argmax</span>()

    <span class="k">plot</span>(grains[id],grains[id].meanOrientation,edgeAlpha=0.2)'
