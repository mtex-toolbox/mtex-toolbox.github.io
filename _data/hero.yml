# generated by tools/hero-code.py from matlab/heroFigures.m - do not edit
steps:
- name: Import
  code: "<span class=\"c\">% an EBSD map of magnesium with many twins</span>\nebsd = <span class=\"k\">EBSD.load</span>(<span class=\"s\">'twins.ctf'</span>,...\n  <span class=\"s\">'EulerCorrection'</span>,<span class=\"k\">rotation.byAxisAngle</span>(xvector,180*degree));\n<span class=\"k\">plot</span>(ebsd(<span class=\"s\">'Magnesium'</span>),<span class=\"s\">'ipfDirection'</span>,zvector)"
  figures:
  - file: figures/hero/import_1.png
    caption: orientation map
- name: Grains
  code: '<span class="c">% reconstruct grains and smooth their boundaries</span>

    [grains,ebsd] = <span class="k">calcGrains</span>(ebsd(<span class="s">''indexed''</span>),<span class="s">''angle''</span>,5*degree);

    grains = <span class="k">smoothBoundary</span>(grains,5);

    <span class="k">plot</span>(grains,<span class="s">''ipfDirection''</span>,zvector)'
  figures:
  - file: figures/hero/grains_1.png
    caption: grains
- name: Clean
  code: '<span class="c">% total variation denoising of the orientations</span>

    F = l1TVFilter;

    ebsdS = <span class="k">smooth</span>(ebsd,F);

    <span class="k">plot</span>(ebsdS,ebsdS.KAM./degree)'
  figures:
  - file: figures/hero/clean_1.png
    caption: KAM 0-2°, measured
  - file: figures/hero/clean_2.png
    caption: KAM 0-2°, denoised
- name: Twins
  code: '<span class="c">% the {10-12} extension twin is a near Sigma 17a boundary</span>

    gB = grains.<span class="k">boundary</span>(<span class="s">''Magnesium''</span>,<span class="s">''Magnesium''</span>);

    twin = <span class="k">CSL</span>(17,grains.CS,<span class="s">''delta''</span>,0.02);

    twinB = gB(gB.<span class="k">isTwinning</span>(twin,5*degree));

    <span class="k">plot</span>(twinB,<span class="s">''lineColor''</span>,<span class="s">''w''</span>,<span class="s">''lineWidth''</span>,3)

    parents = <span class="k">merge</span>(grains,twinB);'
  figures:
  - file: figures/hero/twins_1.png
    caption: twin boundaries
  - file: figures/hero/twins_2.png
    caption: twins merged into their parents
- name: Texture
  code: '<span class="c">% the ODF by kernel density estimation</span>

    odf = <span class="k">calcDensity</span>(ebsd(<span class="s">''Magnesium''</span>).orientations);

    <span class="k">plotPDF</span>(odf,<span class="k">Miller</span>(0,0,0,1,odf.CS))

    <span class="k">plotSection</span>(odf,<span class="s">''sigma''</span>,<span class="s">''sections''</span>,9)'
  figures:
  - file: figures/hero/texture_1.png
    caption: (0001) pole figure
  - file: figures/hero/texture_2.png
    caption: sigma sections
- name: Parent grains
  code: '<span class="c">% prior beta grains from an alpha titanium map</span>

    mtexdata alphaBetaTitanium

    [grains,ebsd] = <span class="k">calcGrains</span>(ebsd,<span class="s">''threshold''</span>,1.5*degree);

    job = <span class="k">parentGrainReconstructor</span>(ebsd,grains);

    job.p2c = <span class="k">orientation.Burgers</span>(job.csParent,job.csChild);

    job.<span class="k">calcVariantGraph</span>(<span class="s">''threshold''</span>,1.5*degree);

    job.<span class="k">clusterVariantGraph</span>(<span class="s">''numIter''</span>,3);

    job.calcParentFromVote;

    <span class="k">plot</span>(job.parentGrains,<span class="s">''ipfDirection''</span>,zvector)'
  figures:
  - file: figures/hero/parent_1.png
    caption: measured alpha titanium
  - file: figures/hero/parent_2.png
    caption: reconstructed beta grains
- name: Properties
  code: "<span class=\"c\">% Young's modulus of magnesium and of the textured map</span>\nCij = [59.7 26.2 21.7 0 0 0;  26.2 59.7 21.7 0 0 0;\n       21.7 21.7 61.7 0 0 0;  0 0 0 16.4 0 0;\n       0 0 0 0 16.4 0;  0 0 0 0 0 16.75];\nC = <span class=\"k\">stiffnessTensor</span>(Cij,ebsd(<span class=\"s\">'Magnesium'</span>).CS);\n[~,~,CHill] = <span class=\"k\">calcTensor</span>(ebsd(<span class=\"s\">'Magnesium'</span>),C);\n<span class=\"k\">plot</span>(C.YoungsModulus,<span class=\"s\">'complete'</span>,<span class=\"s\">'upper'</span>)\n<span class=\"k\">plot</span>(CHill.YoungsModulus,<span class=\"s\">'complete'</span>,<span class=\"s\">'upper'</span>)"
  figures:
  - file: figures/hero/properties_1.png
    caption: single crystal
  - file: figures/hero/properties_2.png
    caption: textured polycrystal
- name: 3D EBSD
  code: '<span class="c">% a 3D EBSD volume and its grains</span>

    ebsd = <span class="k">EBSD3.load</span>(<span class="s">''SmallIN100_MeshStats.dream3d''</span>);

    [grains,ebsd] = <span class="k">calcGrains</span>(ebsd,<span class="s">''angle''</span>,5*degree);

    <span class="k">plot</span>(grains,grains.meanOrientation,<span class="s">''edgeAlpha''</span>,0.1)

    [~,id] = <span class="k">max</span>(grains.volume);

    <span class="k">plot</span>(grains(id),grains(id).meanOrientation,<span class="s">''edgeAlpha''</span>,0.2)'
  figures: []
