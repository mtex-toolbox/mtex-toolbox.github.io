- name: Texture
  code: "<span class=\"c\">% estimate the orientation distribution</span>\nodf = <span class=\"k\">calcDensity</span>(ebsd(<span class=\"s\">'Magnesium'</span>).orientations,...\n  <span class=\"s\">'halfwidth'</span>,10*degree);\n\n<span class=\"c\">% show a pole figure and ODF sections</span>\n<span class=\"k\">plotPDF</span>(odf,<span class=\"k\">Miller</span>(0,0,0,1,odf.CS))\n<span class=\"k\">plotSection</span>(odf,<span class=\"s\">'sigma'</span>,<span class=\"s\">'sections'</span>,9)"
  python: "<span class=\"c\"># estimate the orientation distribution</span>\nodf = <span class=\"k\">calcDensity</span>(ebsd[<span class=\"s\">'Magnesium'</span>].orientations,\n  halfwidth=10*degree)\n\n<span class=\"c\"># show a pole figure and ODF sections</span>\n<span class=\"k\">plotPF</span>(odf,<span class=\"k\">Miller</span>(0,0,0,1,odf.CS))\n<span class=\"k\">plotSection</span>(odf,<span class=\"s\">'sigma'</span>,sections=9)"
