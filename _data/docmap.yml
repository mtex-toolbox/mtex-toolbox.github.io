# Figure and one sentence for each documentation chapter, keyed by the
# chapter page; the section pages Start, Concepts and Tasks show them as cards.
# The chapters themselves and their order come from the sidebar.

sections:
  Start:
    question: Where do I begin?
    text: First steps with MTEX scripts, and five tutorials that each follow one analysis from the data file to a result.
  Concepts:
    question: What is it?
    text: 'The textbook part: what an orientation, a misorientation, an ODF or a tensor is, with the conventions MTEX uses.
      Every page runs MTEX code, so its examples are checked on every build.'
    shelf:
    - Rotations
    - SphericalFunctions
    - SO3Functions
  Tasks:
    question: How do I do it?
    text: The practical pages, ordered along a typical analysis from import to figures.
chapters:
  FirstSteps:
    figure: MTEXScripts_01
    text: 'Scripts, lists, options and properties: how an analysis in MTEX is written.'
  Tutorials:
    figure: EBSDTutorial_03
    text: Five worked routes from the data file to an interpreted result.
  CrystalLattices:
    figure: CrystalReferenceSystem_04
    text: Vectors, axes, Miller indices, the lattice metric and crystal reference frames.
  CrystalGeometry:
    figure: CrystalSymmetries_02
    text: Point groups, Laue groups and fundamental sectors.
  CrystalOrientations:
    figure: OrientationFundamentalRegion_09
    text: What a rotation and an orientation are, the conventions, symmetry and the fundamental region.
  Misorientations:
    figure: MisorientationTheory_02
    text: Misorientation, disorientation, twin relationships and their distributions.
  TextureTheory:
    figure: ODFTheory_02
    text: What an ODF, a pole figure and an inverse pole figure are.
  DensityEstimationAndSampling:
    figure: DensityEstimation_04
    text: Density functions, halfwidth selection, sample size and sampling.
  AnisotropicProperties:
    figure: AnisotropicTheory_02
    text: Tensors and the elastic anisotropy of crystals and aggregates.
  DeformationConcepts:
    figure: SchmidFactor_03
    text: Slip systems, the Schmid factor, dislocations and parent-child variants.
  Rotations:
    figure: OrientationGrid_02
    text: Representations, tangent spaces, embeddings and grids.
  SphericalFunctions:
    figure: S2FunPlotting_02
    text: Spherical functions, harmonics, kernels, quadrature and vector fields.
  SO3Functions:
    figure: SO3FunOperations_02
    text: Orientation functions, Wigner-D functions, kernels, approximation and quadrature.
  ImportExport:
    figure: EBSDReferenceFrame_02
    text: Load EBSD, pole figure, orientation and tensor data, set the reference frames, and write results back out.
  EBSDAnalysis:
    figure: EBSDFilling_02
    text: Select phases and regions, fill and denoise maps, regrid, and handle pseudo-symmetry.
  CorrelatingMaps:
    figure: EBSDMapsAndImages_02
    text: Align EBSD maps with SEM images and other maps, and correct distortions.
  OrientationMaps:
    figure: EBSDIPFMap_04
    text: Colour maps by orientation or property, choose colour keys, and plot orientation populations.
  Grains:
    figure: GrainReconstruction_02
    text: Reconstruct grains, select and merge them, and work with their neighbours.
  GrainShape:
    figure: EllipseBasedParameters_02
    text: Area, perimeter, fitted ellipses, convex hulls and projections of grains.
  OrientationSpread:
    figure: EBSDKAM_03
    text: KAM, GROD, GOS, orientation profiles, GND density and weighted Burgers vectors.
  GrainBoundaries:
    figure: BoundaryPlots_03
    text: 'Select, plot and classify boundaries: CSL, twins, subgrains, curvature, triple points.'
  TextureFromEBSD:
    figure: EBSD2ODF_03
    text: Estimate ODFs and direction densities from individual orientations.
  PoleFigureAnalysis:
    figure: PoleFigure2ODF_03
    text: Correct X-ray and neutron pole figures and reconstruct the ODF.
  ODFAnalysis:
    figure: SigmaSections_06
    text: Model textures, plot them in pole figures and sections, and measure components and strength.
  Tensors:
    figure: WaveVelocities_03
    text: Tensor arithmetic and averages, wave velocities, piezoelectricity, optics, magnetism.
  Plasticity:
    figure: TaylorModel_03
    text: Taylor and Sachs models, slip transmission, twinning and texture evolution.
  PhaseTransitions:
    figure: MaParentGrainReconstruction_05
    text: Fit orientation relationships, reconstruct parent grains and predict transformation textures.
  EBSD3Analysis:
    figure: Grains3D_02
    text: Volume EBSD, three-dimensional grains, their boundaries, size and sections.
  Plotting:
    figure: Annotations_03
    text: Plot types, projections, alignment, colour ranges, annotations and export.
