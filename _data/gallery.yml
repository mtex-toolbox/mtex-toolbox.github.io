- figure: figures/gallery/taylor.png
  page: TaylorModel
  title: Predicting plastic deformation
  labels:
  - Deformation
  - Texture
  code: 'mtexdata csl silent

    ebsd = ebsd(<span class="k">inpolygon</span>(ebsd,[40 20 100 75]));

    grains = <span class="k">smoothBoundary</span>(<span class="k">calcGrains</span>(ebsd,<span class="s">''minPixel''</span>,3),5);

    sS = <span class="k">slipSystem.fcc</span>(grains.CS).symmetrise;

    epsilon = <span class="k">strainTensor</span>(<span class="k">diag</span>([1 0 -1]));

    M = <span class="k">calcTaylor</span>(<span class="k">inv</span>(grains.meanOrientation)*epsilon,sS);

    <span class="k">plot</span>(grains,M)

    mtexColorMap parula

    <span class="k">mtexColorbar</span>(<span class="s">''title''</span>,<span class="s">''Taylor factor''</span>)'
- figure: figures/gallery/slip.png
  page: SlipTransmission
  title: Slip across grain boundaries
  labels:
  - Deformation
  - Boundaries
  code: 'mtexdata titanium silent

    [grains,ebsd] = <span class="k">calcGrains</span>(ebsd);

    grains = <span class="k">smoothBoundary</span>(grains,5);

    sS = <span class="k">slipSystem.basal</span>(ebsd.CS).symmetrise;

    [SF,id] = <span class="k">max</span>(sS.<span class="k">SchmidFactor</span>(<span class="k">inv</span>(grains.meanOrientation)*xvector),[],2);

    sSGrain = grains.meanOrientation .* sS(id);

    gB = grains.<span class="k">boundary</span>(<span class="s">''indexed''</span>);

    mP = <span class="k">mPrime</span>(sSGrain(gB.<span class="k">grainId</span>(:,1)),sSGrain(gB.<span class="k">grainId</span>(:,2)));

    <span class="k">plot</span>(grains,<span class="s">''faceColor''</span>,[0.92 0.94 0.95])

    hold on

    <span class="k">plot</span>(gB,mP,<span class="s">''lineWidth''</span>,4)

    <span class="k">quiver</span>(grains,sSGrain.trace,<span class="s">''color''</span>,[0.08 0.2 0.4])

    hold off

    <span class="k">mtexColorbar</span>(<span class="s">''title''</span>,"m''")'
