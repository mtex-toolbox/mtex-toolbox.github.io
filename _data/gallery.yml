- figure: figures/gallery/density.png
  page: DensityEstimation
  title: From samples to a density
  labels:
  - Texture
  - Mathematics
  code: 'x = <span class="k">linspace</span>(0,1,500);

    f = @(x) (<span class="k">Gaussian</span>(0.2,0.05,x)+<span class="k">Gaussian</span>(0.5,0.2,x))/2;

    sample = <span class="k">discreteSample</span>(f,80,<span class="s">''range''</span>,[0 1]);

    psi = <span class="k">Gaussian</span>(0,0.05);

    estimate = @(x) <span class="k">mean</span>(psi(x-sample),1);

    <span class="k">plot</span>(x,f(x),<span class="s">''lineWidth''</span>,3), hold on

    <span class="k">plot</span>(x,estimate(x),<span class="s">''lineWidth''</span>,3)

    <span class="k">plot</span>(sample,<span class="k">zeros</span>(<span class="k">size</span>(sample)),<span class="s">''.''</span>,<span class="s">''markerSize''</span>,14)

    hold off

    <span class="k">legend</span>(<span class="s">''True density''</span>,<span class="s">''Kernel estimate''</span>,<span class="s">''Sample''</span>,<span class="s">''Location''</span>,<span class="s">''northeast''</span>)

    <span class="k">xlabel</span>(<span class="s">''x''</span>), <span class="k">ylabel</span>(<span class="s">''Density''</span>)'
