- figure: figures/gallery/pftutorial.png
  page: PoleFigureTutorial
  title: Your first pole figure analysis
  labels:
  - Tutorials
  - Pole figures
  code: 'cs = <span class="k">crystalSymmetry</span>(<span class="s">''6/mmm''</span>,[2.633 2.633 4.8],<span class="s">''X||a*''</span>,<span class="s">''Y||b''</span>,<span class="s">''Z||c''</span>);

    h = <span class="k">Miller</span>({0,0,2},{1,0,0},{1,0,1},{1,0,2},cs);

    pf = <span class="k">PoleFigure.load</span>(fname,h,cs,<span class="s">''interface''</span>,<span class="s">''uxd''</span>);

    pfDef = <span class="k">PoleFigure.load</span>(fnameDef,h,cs,<span class="s">''interface''</span>,<span class="s">''uxd''</span>);

    pf = <span class="k">correct</span>(pf,<span class="s">''def''</span>,pfDef);

    pf(pf.intensities&lt;0) = 0;

    odf = <span class="k">calcODF</span>(pf,<span class="s">''silent''</span>);

    <span class="k">plotPDF</span>(odf,h(1))'
