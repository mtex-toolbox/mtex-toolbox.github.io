- figure: figures/gallery/gnd.png
  page: GND
  title: Mapping dislocation density
  labels:
  - EBSD
  - Deformation
  code: 'ebsd = <span class="k">EBSD.load</span>(<span class="k">fullfile</span>(mtexEBSDPath,<span class="s">''DC06_2uniax.ang''</span>),<span class="s">''setting''</span>,2);

    ebsd = ebsd(<span class="k">inpolygon</span>(ebsd,[1 25 48 36]));

    [grains,ebsd] = <span class="k">calcGrains</span>(ebsd,<span class="s">''angle''</span>,2.5*degree,<span class="s">''minPixel''</span>,6);

    ebsd = <span class="k">smooth</span>(ebsd,l1TVFilter,<span class="s">''fill''</span>,grains);

    dS = <span class="k">dislocationSystem.bcc</span>(ebsd.CS);

    dS(dS.isEdge).u = 1;

    dS(dS.isScrew).u = 0.7;

    gnd = <span class="k">calcGND</span>(ebsd,dS);

    <span class="k">plot</span>(ebsd,gnd)

    mtexColorMap hot

    <span class="k">set</span>(gca,<span class="s">''ColorScale''</span>,<span class="s">''log''</span>,<span class="s">''CLim''</span>,[1e11 5e14]);

    <span class="k">mtexColorbar</span>(<span class="s">''title''</span>,<span class="s">''density (1/m^2)''</span>)

    hold on, <span class="k">plot</span>(grains.boundary,<span class="s">''lineWidth''</span>,1.5,<span class="s">''lineColor''</span>,<span class="s">''w''</span>), hold off'
