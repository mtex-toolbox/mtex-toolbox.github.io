- figure: figures/gallery/austenite.png
  page: MaParentGrainReconstruction
  title: Reconstructing parent austenite
  labels:
  - Parent grains
  - Grains
  code: 'mtexdata martensite silent

    job = <span class="k">parentGrainReconstructor</span>(ebsd);

    job.p2c = <span class="k">orientation.KurdjumovSachs</span>(job.csParent,job.csChild);

    job.calcParent2Child;

    job.<span class="k">calcVariantGraph</span>(<span class="s">''threshold''</span>,3.5*degree,<span class="s">''tolerance''</span>,3.5*degree);

    job.<span class="k">clusterVariantGraph</span>(<span class="s">''includeSimilar''</span>);

    job.calcParentFromVote;

    job.<span class="k">mergeSimilar</span>(<span class="s">''threshold''</span>,7.5*degree);

    job.<span class="k">mergeInclusions</span>(<span class="s">''maxSize''</span>,50);

    <span class="k">plot</span>(job.parentGrains,job.parentGrains.meanOrientation)'
- figure: figures/gallery/images.png
  page: EBSDMapsAndImages
  title: Correlating EBSD and SEM images
  labels:
