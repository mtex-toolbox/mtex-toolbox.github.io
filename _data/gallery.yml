  code: 'mtexdata trueEbsdWCCoSmall silent

    img = ebsd.opt.trueEbsdImgs;

    sem = <span class="k">mapImage</span>(img.fsdT1,<span class="s">''dxy''</span>,img.pixSzImg,<span class="s">''origin''</span>,ebsd.<span class="k">pos</span>(1,1));

    ebsd.prop.fsd = <span class="k">interp</span>(sem,ebsd.pos);

