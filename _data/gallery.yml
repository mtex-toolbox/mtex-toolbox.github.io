# The gallery (pages/gallery/gallery.md): a hand-picked list of figures that
# the documentation build renders. Each figure is <page>_<NN>.png in figures/,
# linked to the page that draws it. Review the list once per release: a figure
# number can shift when a page gains or loses a figure.
#
# tags: ebsd, grains, parent, texture, tensors, 3d, geometry

tags:
  - [ebsd, EBSD maps]
  - [grains, Grains & boundaries]
  - [parent, Parent grains]
  - [texture, Pole figures & ODFs]
  - [tensors, Tensors]
  - [3d, 3D]
  - [geometry, Crystal geometry]

figures:
  - figure: TiBetaReconstruction_02
    title: β-grains in titanium
    text: Prior β grains reconstructed from an α-titanium EBSD map.
    tags: [parent, ebsd]
  - figure: PoleFigure2ODF_03
    title: ODF from pole figures
    text: Seven measured X-ray pole figures, the input to computing the orientation distribution function.
    tags: [texture]
  - figure: WaveVelocities_03
    title: Seismic wave velocities
    text: Wave speeds and their anisotropy, computed from an elastic stiffness tensor.
    tags: [tensors]
  - figure: CrystalShapes_05
    title: Grains drawn as crystals
    text: Every grain shown as a hexagonal crystal rotated to its mean orientation.
    tags: [geometry, grains]
  - figure: MaParentGrainReconstruction_01
    title: Martensite orientation map
    text: An EBSD map of lath martensite in steel, the starting point for recovering the parent austenite grains.
    tags: [ebsd, parent]
  - figure: GrainGraphBasedReconstruction_07
    title: Parent austenite grains
    text: Parent grains recovered from the martensite orientations with the grain graph method.
    tags: [parent, grains]
  - figure: EBSDDenoising_02
    title: Denoised orientation maps
    text: Measurement noise smoothed away while the grain boundaries stay sharp.
    tags: [ebsd]
  - figure: SigmaSections_06
    title: ODF sigma sections
    text: An orientation distribution shown as sigma sections, the default ODF plot.
    tags: [texture]
  - figure: Grains3D_01
    title: 3D grain structures
    text: A three-dimensional grain map, analysed with the same commands as a 2D EBSD map.
    tags: [3d, grains]
  - figure: SubGrainBoundaries_05
    title: Subgrain boundaries
    text: Low-angle boundaries separated from high-angle grain boundaries in a deformed map.
    tags: [grains, ebsd]
  - figure: TiltAndTwistBoundaries_06
    title: Tilt and twist boundaries
    text: Grain boundaries classified by the geometry of their misorientation axis.
    tags: [grains]
  - figure: EBSDIPFMap_04
    title: Orientation colour keys
    text: Orientation gradients inside grains, coloured relative to each grain's mean orientation.
    tags: [ebsd]
  - figure: OrientationFundamentalRegion_09
    title: Fundamental regions
    text: Orientations plotted in Euler space inside the fundamental region of their symmetry.
    tags: [geometry]
  - figure: ExIceSphericity_01
    title: Grain shape statistics
    text: Ice grains coloured by orientation, ready for shape measures such as sphericity.
    tags: [grains]
